[project]
name = "val2026-prediction"
version = "0.1.0"
description = "Reproducible district-level Swedish election forecasting research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4",
  "httpx>=0.28",
  "openpyxl>=3.1",
  "polars>=1.35",
  "pyarrow>=22",
  "pyyaml>=6.0",
  "scikit-learn>=1.7",
  "typer>=0.20",
]

[project.optional-dependencies]
geo = [
  "geopandas>=1.1",
  "pyproj>=3.7",
  "shapely>=2.1",
]

[project.scripts]
valforecast = "valforecast.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=9.0",
  "ruff>=0.14",
  "types-openpyxl>=3.1",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valforecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["valforecast"]

